[project]
name = "qello-knowledge"
version = "0.1.0"
description = "팀 공용 자료를 근거로 답하는 RAG 지식 검색 시스템"
readme = "README.md"
requires-python = ">=3.13"
# 런타임 의존성은 Cloudflare Python Workers에서도 돌아야 하므로 비워 둔다(research R-03).
dependencies = []

[project.optional-dependencies]
# 청커(QK-CHK-002)만 쓴다. 질의응답 번들에는 넣지 않는다(research R-01).
index = ["markdown-it-py==4.2.0"]
# 색인 CLI와 마이그레이션 실행기만 쓴다. 질의응답 번들에는 넣지 않는다(QK-STO-001 research R-09).
postgres = ["psycopg[binary]>=3.2"]
# 질의 서비스만 쓴다. Worker 번들에는 넣지 않는다(QK-BOT-001 research R-04).
query = ["cryptography>=43"]

[project.scripts]
qk-index = "qello_knowledge.indexer.cli:main"
qk-query = "qello_knowledge.query.server:main"
qk-dev = "qello_knowledge.devtools.db:main"
qk-migrate = "qello_knowledge.adapters.postgres.migrate:main"

[dependency-groups]
dev = [
    "cryptography>=43",
    "markdown-it-py==4.2.0",
    "pytest>=8",
    "ruff>=0.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 120
# 기존 하네스 스크립트와 Spec Kit 파일은 이 작업 범위 밖이라 린트하지 않는다(QK-FND-001 research R-08).
extend-exclude = [".claude", ".agents", ".codex", ".specify", "scripts", "tests/test_jira_subtask.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not external' --strict-markers"
markers = [
    "localdb: 로컬 개발 DB가 필요한 테스트. QK_REQUIRE_LOCALDB=1이면 DB가 없을 때 실패한다",
    "external: 실제 외부 API를 호출하는 테스트. 기본 실행에서 빠지고 -m external로 켠다",
]
