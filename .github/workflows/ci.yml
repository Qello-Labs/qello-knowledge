name: CI

# 테스트·린트·비밀값 검사를 job 셋으로 나눠 PR에 따로 표시한다(QK-FND-001 FR-018~021).
# 저장소 Secret을 쓰지 않으므로 포크 PR에서도 같은 결과가 나온다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Start local DB
        run: uv run qk-dev db up
      # 마이그레이션 두 번 적용: 두 번째는 변경 0건이어야 한다(QK-STO-001 FR-020, SC-004)
      - name: Apply migrations twice
        run: |
          uv run qk-migrate
          second="$(uv run qk-migrate)"
          echo "$second"
          grep -q '^applied=0 ' <<<"$second"
      - name: Run tests
        env:
          QK_REQUIRE_LOCALDB: "1"
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # Discord 중계 Worker(TypeScript) 계약 시험. npm 의존성 없이 Node 내장 시험과 타입 제거 실행으로 돈다(ADR-024).
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test workers/relay/relay.test.ts

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret preflight
        run: python3 scripts/preflight.py
      - name: Whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD
