# max_backoff_seconds = 60

[[source]]
name = "dnd-backend-docs"
kind = "github_repo_files"
enabled = true
auth = "GITHUB_API_TOKEN"
[source.scope]
repo = "dnd-side-project/dnd-15th-2-backend"
ref = "main"
include = [
  "README.md", "AGENTS.md", "CLAUDE.md", "CODEX.md", "TASK.md",
  "docs/adr/**/*.md", "docs/product/**/*.md", "docs/harness/**/*.md",
  "docs/api-response.md", "docs/error-codes.md", "docs/filtering-production-gate.md",
  "docs/push-production-setup.md", "docs/api/OPENAPI_WRITING_GUIDE.md",
  "docs/superpowers/plans/**/*.md", "docs/superpowers/specs/**/*.md",
  "infra/**/*.md", "**/AGENTS.md", ".github/PULL_REQUEST_TEMPLATE.md", "scripts/repo-map/README.md",
]
exclude = [".claude/**", ".agents/**", ".codex/**", "agents/**", "templates/**", "docs/experiments/**", "docs/harness/ARCHITECTURE.md"]

# 활성화 선행 조건: 자료원별 식별 명세 완료, QK-STO-002 새 인덱스 버전 활성화, 사람의 개인 정보 확인 기록(ADR-023)
[[source]]
name = "dnd-backend-code"
kind = "github_repo_files"
enabled = false
auth = "GITHUB_API_TOKEN"
[source.scope]
repo = "dnd-side-project/dnd-15th-2-backend"
ref = "main"
include = ["src/main/java/**/*.java"]

# 활성화 선행 조건: 자료원별 식별 명세 완료, QK-STO-002 새 인덱스 버전 활성화, 사람의 개인 정보 확인 기록(ADR-023)
[[source]]
name = "dnd-android-code"
kind = "github_repo_files"
enabled = false
auth = "GITHUB_API_TOKEN"
[source.scope]
repo = "dnd-side-project/dnd-15th-2-android"
ref = "main"
include = ["app/src/main/**/*.kt", "data/src/main/**/*.kt", "domain/src/main/**/*.kt", "presentation/src/main/**/*.kt"]

# Confluence SCRUM 스페이스(ADR-026 Accepted, QK-ING-003). 확인 기록(config/source_reviews/confluence-scrum.toml)과 첫 측정(FR-027)은 끝났다.
# 남은 활성화 선행 조건: INDEX_KEYWORD_RULES 등록과 QK-STO-002 절차
[[source]]
name = "confluence-scrum"
kind = "confluence_pages"
enabled = false
auth = "ATLASSIAN_API_TOKEN"
allowed_hosts = ["api.atlassian.com"]
[source.scope]
include = ["**"]
space_key = "SCRUM"
space_id = "98307"
judge_mode = "site_users"
# 3571713: 골든셋 v0 질문 목록(검색 평가 오염 방지)
exclude_trees = ["3571713"]
# 홈(98420) 바로 아래 콘텐츠 ID → 문서 종류(FR-020). 대응표에 없는 첫 단계 아래 페이지는 미분류로 색인하지 않는다
[source.scope.doc_types]
"98458" = "회의록"
"66695" = "용어집"
"66183" = "기능 명세"
"295131" = "설계 문서"
