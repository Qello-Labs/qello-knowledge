# Discord 중계 Worker(ADR-022, ADR-024). TypeScript 진입점을 wrangler가 그대로 묶는다(npm 의존성 없음).
# 실제 VPC Service ID는 저장소 밖 사본에 넣고 `npx wrangler deploy -c <사본>`으로 배포한다.
name = "qello-knowledge-relay"
main = "workers/relay/index.ts"
compatibility_date = "2026-10-26"

[[vpc_services]]
binding = "QUERY_SERVICE"
service_id = "<vpc-service-id>"

[vars]
QK_RELAY_TIMEOUT_SECONDS = "2.5"

# DISCORD_PUBLIC_KEY는 사람이 wrangler secret put DISCORD_PUBLIC_KEY로 등록한다.
